[project]
name = "code-review-agent"
version = "0.1.0"
description = "AI-powered Python code review agent built on Claude"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "typer",
    "rich",
    "pydantic",
    "gitpython",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "bandit",
    "mypy",
    "radon",
    "pre-commit",
]

[project.scripts]
review-agent = "code_review_agent.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true